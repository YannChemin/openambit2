<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <style>
    html,body { margin:0; padding:0; width:100%; height:100%; background:#1e1e2e; overflow:hidden;
                font-family: Cantarell, "Noto Sans", sans-serif; font-size:13px; }
    #map, #globe { position:absolute; top:0; left:0; right:0; bottom:0; }
    #globe { display:none; }
    body.mode3d #map { display:none; }
    body.mode3d #globe { display:block; }
    .overlay { position:absolute; z-index:1000; background:rgba(30,30,46,0.88); color:#e6e6e6;
               border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,0.4); }
    #modeSwitch { top:10px; right:10px; display:flex; padding:2px; }
    #modeSwitch button { border:0; background:transparent; color:#e6e6e6; padding:5px 12px;
                         border-radius:4px; cursor:pointer; font:inherit; font-weight:bold; }
    #modeSwitch button.active { background:#3584e4; color:#fff; }
    #panel3d { top:48px; right:10px; padding:8px 10px; display:none; min-width:180px; }
    body.mode3d #panel3d { display:block; }
    #panel3d label { display:flex; align-items:center; gap:6px; margin:4px 0; }
    #panel3d input[type=range] { width:100px; }
    #status { bottom:22px; left:10px; padding:4px 8px; max-width:70%; display:none; }
    body.mode3d #status { display:block; }
    #message { top:50%; left:50%; transform:translate(-50%,-50%); padding:12px 16px; display:none; max-width:60%; }
    .cesium-viewer-bottom { opacity:0.8; }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<div id="map"></div>
<div id="globe"></div>
<div id="modeSwitch" class="overlay">
  <button id="btn2d" class="active" onclick="setMode('2d', true)">2D</button>
  <button id="btn3d" onclick="setMode('3d', true)">3D</button>
</div>
<div id="panel3d" class="overlay">
  <label><span id="lblExaggeration">Relief exaggeration</span>
    <input id="exaggeration" type="range" min="1" max="3" step="0.5" value="1" oninput="setExaggeration(this.value)">
    <span id="exaggerationValue">1×</span></label>
  <label><input id="curtain" type="checkbox" checked onchange="render3DTracks()"> <span id="lblCurtain">Altitude curtain</span></label>
</div>
<div id="status" class="overlay"></div>
<div id="message" class="overlay"></div>
<script>
// Map of the logged tracks for Openambit.
//
// 2D: Leaflet over OpenStreetMap.
// 3D: CesiumJS (loaded on first use), with satellite imagery draped over a
// terrain model. Every source is free and needs no account or key; each one
// is probed and the next is used when it cannot be reached:
//   imagery: Esri World Imagery -> Sentinel-2 cloudless by EOX -> OpenStreetMap
//   terrain: Terrain Tiles (Mapzen "terrarium" on AWS Open Data, global)
//            -> Copernicus GLO-90 around the loaded tracks, downloaded by the
//               application (its bucket sends no CORS headers) -> flat globe
// Flown tracks (air sports) are drawn at their recorded altitude, with an
// optional curtain down to the ground; other tracks are draped on the relief.
// Both the watch altitudes and the terrain heights are above mean sea level,
// so they are compared directly, without a geoid correction.

// The C++ side listens to console messages carrying this prefix.
function send(msg) { console.log('__openambit__' + JSON.stringify(msg)); }

// Interface strings, replaced by the translated ones from setStrings().
var T = {
  view2d: '2D', view3d: '3D',
  view2dTip: 'Flat map (OpenStreetMap)', view3dTip: 'Relief with satellite imagery',
  loading3d: 'Loading the 3D globe...',
  noWebGL: '3D view unavailable: this system has no WebGL support.',
  no3dLibrary: '3D view unavailable: the CesiumJS library could not be loaded (offline?).',
  imagery: 'Imagery', terrain: 'Terrain',
  terrainTiles: 'Terrain Tiles (AWS Open Data)',
  terrainCopernicus: 'Copernicus GLO-90 (around the tracks)',
  terrainCopernicusLoading: 'Downloading Copernicus GLO-90 elevation tiles: %1 of %2...',
  terrainNone: 'none (flat)',
  terrainNoTracks: 'none: load a track to fetch the Copernicus elevation model around it',
  imageryEsri: 'Esri World Imagery', imageryS2: 'Sentinel-2 cloudless (EOX)', imageryOsm: 'OpenStreetMap',
  exaggeration: 'Relief exaggeration', curtain: 'Altitude curtain',
  distance: 'Distance', duration: 'Duration', altitude: 'Altitude', minutesUnit: 'min',
  categoryAir: 'Air sports'
};

function setStrings(s) {
  for (var k in s) T[k] = s[k];
  document.getElementById('btn2d').textContent = T.view2d;
  document.getElementById('btn3d').textContent = T.view3d;
  document.getElementById('btn2d').title = T.view2dTip;
  document.getElementById('btn3d').title = T.view3dTip;
  document.getElementById('lblExaggeration').textContent = T.exaggeration;
  document.getElementById('lblCurtain').textContent = T.curtain;
  updateStatus();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function showMessage(text) {
  var m = document.getElementById('message');
  m.textContent = text || '';
  m.style.display = text ? 'block' : 'none';
}

// ---------------------------------------------------------------- tracks ---

// Every loaded GeoJSON, kept so that both views can draw it.
var tracks = {};   // id -> { data, color, visible }

function featureProps(data) {
  var f = data && data.features && data.features[0];
  return (f && f.properties) || {};
}

function popupHtml(p) {
  var html = '';
  if (p.name) html += '<b>' + escapeHtml(p.name) + '</b><br>';
  if (p.activity) html += escapeHtml(p.activity) + '<br>';
  if (p.category === 'air') html += escapeHtml(T.categoryAir) + '<br>';
  if (p.distance_m) html += escapeHtml(T.distance) + ': ' + (p.distance_m / 1000).toFixed(2) + ' km<br>';
  if (p.duration_s) html += escapeHtml(T.duration) + ': ' + Math.floor(p.duration_s / 60) + ' ' + escapeHtml(T.minutesUnit) + '<br>';
  if (p.altitude_max_m !== undefined && p.altitude_max_m !== p.altitude_min_m)
    html += escapeHtml(T.altitude) + ': ' + p.altitude_min_m + ' – ' + p.altitude_max_m + ' m';
  return html;
}

// ---------------------------------------------------------------- 2D view --

// Default center: Plumergat, Bretagne, France — overridden by setView() or restoreView()
var map = L.map('map').setView([47.817, -2.817], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

var layers = {};

function loadGeoJSON(id, data, color) {
  if (layers[id]) { map.removeLayer(layers[id]); }
  var parsed = JSON.parse(data);
  tracks[id] = { data: parsed, color: color || '#3584e4', visible: true };
  layers[id] = L.geoJSON(parsed, {
    style: function(f) {
      return { color: color || '#3584e4', weight: 3, opacity: 0.85 };
    },
    pointToLayer: function(f, ll) {
      return L.circleMarker(ll, { radius: 6, color: color || '#f5a623',
        fillColor: color || '#f5a623', fillOpacity: 0.9, weight: 2 });
    },
    onEachFeature: function(f, layer) {
      if (f.properties) {
        var popup = popupHtml(f.properties);
        if (popup) layer.bindPopup(popup);
      }
    }
  }).addTo(map);

  // Flights are best seen in relief: an air sports track opens the 3D view
  if (featureProps(parsed).prefers_3d && mode !== '3d') {
    setMode('3d', false);
  } else if (mode === '3d') {
    render3DTracks();
    requestFallbackDemIfNeeded();
  }
}

function showLayer(id, visible) {
  if (!layers[id]) return;
  tracks[id].visible = visible;
  if (visible) { map.addLayer(layers[id]); }
  else { map.removeLayer(layers[id]); }
  if (mode === '3d') render3DTracks();
}

function clearLayer(id) {
  if (layers[id]) { map.removeLayer(layers[id]); delete layers[id]; }
  delete tracks[id];
  if (mode === '3d') render3DTracks();
}

function trackBounds() {
  var bounds = null;
  Object.keys(layers).forEach(function(id) {
    if (!tracks[id] || !tracks[id].visible) return;
    try { var b = layers[id].getBounds(); bounds = bounds ? bounds.extend(b) : L.latLngBounds(b.getSouthWest(), b.getNorthEast()); } catch(e) {}
  });
  return (bounds && bounds.isValid()) ? bounds : null;
}

function fitAll() {
  if (mode === '3d' && viewer) { fit3D(); return; }
  var bounds = trackBounds();
  if (bounds) { map.fitBounds(bounds, { padding: [20, 20] }); }
}

// Called from C++ to restore the last-saved view (lat, lon, zoom)
function restoreView(lat, lon, zoom) {
  map.setView([lat, lon], zoom);
}

// Called from C++ to jump to the default home location (no saved GeoJSON yet)
function setHomeView(lat, lon, zoom) {
  map.setView([lat, lon], zoom);
}

function reportView(lat, lon, zoom) {
  send({ type: 'view', lat: +lat.toFixed(6), lon: +lon.toFixed(6), zoom: Math.round(zoom) });
}

// Notify C++ of every view change so it can persist the state
map.on('moveend zoomend', function() {
  if (mode !== '2d') return;
  var c = map.getCenter();
  reportView(c.lat, c.lng, map.getZoom());
});

// ---------------------------------------------------------------- 2D <-> 3D

var mode = '2d';

function setMode(newMode, fromUser) {
  if (newMode === mode) return;
  if (newMode === '3d') {
    if (!hasWebGL()) { showMessage(T.noWebGL); setTimeout(showMessage, 5000); return; }
    mode = '3d';
    document.body.classList.add('mode3d');
    ensureGlobe(function(ok) {
      if (!ok) { setMode('2d', false); showMessage(T.no3dLibrary); setTimeout(showMessage, 6000); return; }
      viewer.resize();
      var hasTracks = render3DTracks();
      if (!fromUser && hasTracks) fit3D(); else viewFrom2D();
      globePositioned = true;
      requestFallbackDemIfNeeded();
    });
  } else {
    if (viewer) viewTo2D();
    mode = '2d';
    document.body.classList.remove('mode3d');
    map.invalidateSize();
  }
  document.getElementById('btn2d').classList.toggle('active', mode === '2d');
  document.getElementById('btn3d').classList.toggle('active', mode === '3d');
  // Only a choice made by the user becomes the mode of the next session
  send({ type: 'mode', mode: mode, user: !!fromUser });
}

function hasWebGL() {
  try {
    var c = document.createElement('canvas');
    return !!(c.getContext('webgl2') || c.getContext('webgl'));
  } catch (e) { return false; }
}

// Ground resolution of a Web Mercator zoom level, in metres per pixel.
function metresPerPixel(lat, zoom) {
  return 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, zoom);
}

function viewFrom2D() {
  var c = map.getCenter();
  var visible = metresPerPixel(c.lat, map.getZoom()) * Math.max(200, document.body.clientHeight);
  var height = Math.max(300, visible * 0.9);
  // Look north at 45 degrees: the camera stands one height south of the centre
  viewer.camera.setView({
    destination: Cesium.Cartesian3.fromDegrees(c.lng, c.lat - height / 111320, height),
    orientation: { heading: 0, pitch: Cesium.Math.toRadians(-45), roll: 0 }
  });
}

function globeCentre() {
  var scene = viewer.scene;
  var centre = new Cesium.Cartesian2(scene.canvas.clientWidth / 2, scene.canvas.clientHeight / 2);
  var p = scene.globe.pick(viewer.camera.getPickRay(centre), scene) ||
          viewer.camera.pickEllipsoid(centre, scene.globe.ellipsoid);
  var carto = p ? Cesium.Cartographic.fromCartesian(p) : viewer.camera.positionCartographic;
  var dist = p ? Cesium.Cartesian3.distance(p, viewer.camera.position) : viewer.camera.positionCartographic.height;
  return { lat: Cesium.Math.toDegrees(carto.latitude), lon: Cesium.Math.toDegrees(carto.longitude), dist: dist };
}

function viewTo2D() {
  var c = globeCentre();
  var mpp = c.dist / 0.9 / Math.max(200, document.body.clientHeight);
  var zoom = Math.log(156543.03392 * Math.cos(c.lat * Math.PI / 180) / mpp) / Math.LN2;
  map.setView([c.lat, c.lon], Math.max(1, Math.min(19, Math.round(zoom))), { animate: false });
}

// ---------------------------------------------------------------- 3D view --

var CESIUM_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/';
var viewer = null;
var globeCallbacks = null;
var globePositioned = false;   // Cesium's default camera is not a view to save
var imageryName = '', terrainName = '', terrainState = '', demProgress = '';
var exaggeration = 1;
var entities3d = [];

// Qt WebEngine 5.15 runs Chromium 87, older than what current CesiumJS
// expects: these are the only missing library functions it calls.
function polyfill() {
  function def(o, n, f) { if (!o[n]) Object.defineProperty(o, n, { value: f, writable: true, configurable: true }); }
  [Array, Float32Array, Float64Array, Uint8Array, Uint8ClampedArray, Uint16Array, Uint32Array,
   Int8Array, Int16Array, Int32Array].forEach(function(C) {
    var p = C.prototype;
    def(p, 'at', function(i) { i = Math.trunc(i) || 0; if (i < 0) i += this.length; return this[i]; });
    def(p, 'findLast', function(f, t) { for (var i = this.length - 1; i >= 0; i--) if (f.call(t, this[i], i, this)) return this[i]; });
    def(p, 'findLastIndex', function(f, t) { for (var i = this.length - 1; i >= 0; i--) if (f.call(t, this[i], i, this)) return i; return -1; });
    def(p, 'toSorted', function(c) { return this.slice().sort(c); });
    def(p, 'toReversed', function() { return this.slice().reverse(); });
  });
  def(String.prototype, 'at', function(i) { i = Math.trunc(i) || 0; if (i < 0) i += this.length; return this.charAt(i) || undefined; });
  def(String.prototype, 'replaceAll', function(a, b) { return this.split(a).join(b); });
  def(Object, 'hasOwn', function(o, k) { return Object.prototype.hasOwnProperty.call(o, k); });
  if (!window.structuredClone) window.structuredClone = function(v) { return JSON.parse(JSON.stringify(v)); };
}

function ensureGlobe(callback) {
  if (viewer) { callback(true); return; }
  if (globeCallbacks) { globeCallbacks.push(callback); return; }
  globeCallbacks = [callback];
  showMessage(T.loading3d);
  polyfill();
  window.CESIUM_BASE_URL = CESIUM_URL;
  var css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = CESIUM_URL + 'Widgets/widgets.css';
  document.head.appendChild(css);
  var script = document.createElement('script');
  script.src = CESIUM_URL + 'Cesium.js';
  var done = function(ok) {
    showMessage('');
    var cbs = globeCallbacks; globeCallbacks = null;
    cbs.forEach(function(cb) { cb(ok); });
  };
  script.onload = function() {
    try { createViewer(); done(true); }
    catch (e) { console.error('3D view: ' + e); viewer = null; done(false); }
  };
  script.onerror = function() { done(false); };
  document.head.appendChild(script);
}

function createViewer() {
  viewer = new Cesium.Viewer('globe', {
    baseLayer: false,             // No Cesium ion default: sources are chosen below
    terrainProvider: new Cesium.EllipsoidTerrainProvider(),
    baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false,
    navigationHelpButton: false, animation: false, timeline: false, fullscreenButton: false,
    selectionIndicator: false, infoBox: true, shadows: false
  });
  viewer.scene.globe.depthTestAgainstTerrain = true;
  viewer.scene.globe.enableLighting = false;
  viewer.camera.moveEnd.addEventListener(function() {
    if (mode !== '3d' || !globePositioned) return;
    var c = globeCentre();
    var mpp = c.dist / 0.9 / Math.max(200, document.body.clientHeight);
    reportView(c.lat, c.lon, Math.log(156543.03392 * Math.cos(c.lat * Math.PI / 180) / mpp) / Math.LN2);
  });
  chooseImagery();
  chooseTerrain();
}

function updateStatus() {
  var s = document.getElementById('status');
  if (!viewer) { s.textContent = ''; return; }
  var t = terrainName || '…';
  if (demProgress) t = demProgress;
  s.textContent = T.imagery + ': ' + (imageryName || '…') + '  ·  ' + T.terrain + ': ' + t;
}

// Loads one image the way Cesium will (CORS), to see if a source is reachable.
function probeImage(url, timeoutMs) {
  return new Promise(function(resolve) {
    var img = new Image();
    var timer = setTimeout(function() { img.src = ''; resolve(false); }, timeoutMs);
    img.crossOrigin = 'anonymous';
    img.onload = function() { clearTimeout(timer); resolve(img.width > 0); };
    img.onerror = function() { clearTimeout(timer); resolve(false); };
    img.src = url;
  });
}

function chooseImagery() {
  var sources = [
    { name: 'imageryEsri', probe: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/2/1/1',
      url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      credit: 'Esri, Maxar, Earthstar Geographics, and the GIS User Community', maximumLevel: 19 },
    { name: 'imageryS2', probe: 'https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless_3857/default/g/2/1/1.jpg',
      url: 'https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless_3857/default/g/{z}/{y}/{x}.jpg',
      credit: 'Sentinel-2 cloudless - https://s2maps.eu by EOX IT Services GmbH (Contains modified Copernicus Sentinel data 2016 & 2017)',
      maximumLevel: 15 },
    { name: 'imageryOsm', probe: 'https://tile.openstreetmap.org/2/1/1.png',
      url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      credit: '© OpenStreetMap contributors', maximumLevel: 19 }
  ];
  var i = 0;
  (function next() {
    if (i >= sources.length) { imageryName = '—'; updateStatus(); return; }
    var src = sources[i++];
    probeImage(src.probe, 6000).then(function(ok) {
      if (!ok) { next(); return; }
      viewer.imageryLayers.removeAll();
      viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
        url: src.url, credit: src.credit, maximumLevel: src.maximumLevel
      }));
      imageryName = T[src.name];
      updateStatus();
    });
  })();
}

// ------------------------------------------------------------ terrain ------

var TERRARIUM_URL = 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/';
var TERRARIUM_MAX_ZOOM = 15;
var HEIGHTMAP_SIZE = 65;
var terrariumCache = {};
var terrariumCacheKeys = [];
var fallbackDem = null;
var fallbackDemRequested = false;

// Decodes a terrarium tile into a 256x256 Float32Array of heights in metres:
// height = R * 256 + G + B / 256 - 32768.
function loadTerrariumTile(z, x, y) {
  var key = z + '/' + x + '/' + y;
  if (terrariumCache[key]) return terrariumCache[key];
  var promise = fetch(TERRARIUM_URL + key + '.png')
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
    .then(function(blob) { return createImageBitmap(blob); })
    .then(function(bitmap) {
      var canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(bitmap, 0, 0);
      var px = ctx.getImageData(0, 0, 256, 256).data;
      var h = new Float32Array(256 * 256);
      for (var i = 0; i < h.length; i++)
        h[i] = px[4 * i] * 256 + px[4 * i + 1] + px[4 * i + 2] / 256 - 32768;
      return h;
    });
  promise.catch(function() { delete terrariumCache[key]; });
  terrariumCache[key] = promise;
  terrariumCacheKeys.push(key);
  if (terrariumCacheKeys.length > 512) delete terrariumCache[terrariumCacheKeys.shift()];
  return promise;
}

function bilinear(h, size, fx, fy) {
  fx = Math.max(0, Math.min(size - 1, fx));
  fy = Math.max(0, Math.min(size - 1, fy));
  var x0 = Math.floor(fx), y0 = Math.floor(fy);
  var x1 = Math.min(x0 + 1, size - 1), y1 = Math.min(y0 + 1, size - 1);
  var ax = fx - x0, ay = fy - y0;
  var top = h[y0 * size + x0] * (1 - ax) + h[y0 * size + x1] * ax;
  var bottom = h[y1 * size + x0] * (1 - ax) + h[y1 * size + x1] * ax;
  return top * (1 - ay) + bottom * ay;
}

// Web Mercator heightmaps sampled from terrarium tiles; levels deeper than the
// source reuse a window of their ancestor tile.
function terrariumProvider() {
  return new Cesium.CustomHeightmapTerrainProvider({
    width: HEIGHTMAP_SIZE, height: HEIGHTMAP_SIZE,
    tilingScheme: new Cesium.WebMercatorTilingScheme(),
    credit: 'Terrain Tiles: Mapzen, AWS Open Data (SRTM, GMTED, ETOPO1, NED, EU-DEM and others)',
    callback: function(x, y, level) {
      var z = Math.min(level, TERRARIUM_MAX_ZOOM);
      var scale = Math.pow(2, level - z);
      var sx = Math.floor(x / scale), sy = Math.floor(y / scale);
      var ox = (x - sx * scale) / scale, oy = (y - sy * scale) / scale;
      return loadTerrariumTile(z, sx, sy).then(function(src) {
        var out = new Float32Array(HEIGHTMAP_SIZE * HEIGHTMAP_SIZE);
        for (var j = 0; j < HEIGHTMAP_SIZE; j++) {
          var v = oy + j / (HEIGHTMAP_SIZE - 1) / scale;
          for (var i = 0; i < HEIGHTMAP_SIZE; i++) {
            var u = ox + i / (HEIGHTMAP_SIZE - 1) / scale;
            out[j * HEIGHTMAP_SIZE + i] = bilinear(src, 256, u * 256 - 0.5, v * 256 - 0.5);
          }
        }
        return out;
      }).catch(function() { return new Float32Array(HEIGHTMAP_SIZE * HEIGHTMAP_SIZE); });
    }
  });
}

// Geographic heightmaps sampled from the Copernicus grid sent by C++; sea
// level outside it.
function fallbackProvider(dem) {
  var tiling = new Cesium.GeographicTilingScheme();
  return new Cesium.CustomHeightmapTerrainProvider({
    width: HEIGHTMAP_SIZE, height: HEIGHTMAP_SIZE, tilingScheme: tiling,
    credit: 'Copernicus DEM GLO-90: © DLR e.V. 2010-2014 and © Airbus Defence and Space GmbH 2014-2018, provided under COPERNICUS by the European Union and ESA',
    callback: function(x, y, level) {
      var r = tiling.tileXYToRectangle(x, y, level);
      var west = Cesium.Math.toDegrees(r.west), east = Cesium.Math.toDegrees(r.east);
      var south = Cesium.Math.toDegrees(r.south), north = Cesium.Math.toDegrees(r.north);
      var out = new Float32Array(HEIGHTMAP_SIZE * HEIGHTMAP_SIZE);
      for (var j = 0; j < HEIGHTMAP_SIZE; j++) {
        var lat = north - (north - south) * j / (HEIGHTMAP_SIZE - 1);
        var row = (dem.lat0 - lat) / dem.dy;
        for (var i = 0; i < HEIGHTMAP_SIZE; i++) {
          var lon = west + (east - west) * i / (HEIGHTMAP_SIZE - 1);
          var col = (lon - dem.lon0) / dem.dx;
          if (col < -0.5 || row < -0.5 || col > dem.width - 0.5 || row > dem.height - 0.5) continue;
          out[j * HEIGHTMAP_SIZE + i] = bilinearRect(dem.heights, dem.width, dem.height, col, row);
        }
      }
      return out;
    }
  });
}

function bilinearRect(h, w, hgt, fx, fy) {
  fx = Math.max(0, Math.min(w - 1, fx));
  fy = Math.max(0, Math.min(hgt - 1, fy));
  var x0 = Math.floor(fx), y0 = Math.floor(fy);
  var x1 = Math.min(x0 + 1, w - 1), y1 = Math.min(y0 + 1, hgt - 1);
  var ax = fx - x0, ay = fy - y0;
  var top = h[y0 * w + x0] * (1 - ax) + h[y0 * w + x1] * ax;
  var bottom = h[y1 * w + x0] * (1 - ax) + h[y1 * w + x1] * ax;
  return top * (1 - ay) + bottom * ay;
}

function chooseTerrain() {
  loadTerrariumTile(0, 0, 0).then(function() {
    viewer.terrainProvider = terrariumProvider();
    terrainState = 'tiles';
    terrainName = T.terrainTiles;
    updateStatus();
  }).catch(function() {
    terrainState = 'none';
    terrainName = T.terrainNone;
    updateStatus();
    requestFallbackDemIfNeeded();
  });
}

// Asks C++ for the Copernicus DEM around the visible tracks, once the
// terrain tiles turned out to be unreachable.
function requestFallbackDemIfNeeded() {
  if (!viewer || terrainState !== 'none' || fallbackDemRequested) return;
  var b = trackBounds();
  if (!b) { terrainName = T.terrainNoTracks; updateStatus(); return; }
  // A margin shows the slopes around the flight, not just under it
  var mx = Math.max(0.05, (b.getEast() - b.getWest()) * 0.3);
  var my = Math.max(0.05, (b.getNorth() - b.getSouth()) * 0.3);
  fallbackDemRequested = true;
  send({ type: 'demRequest', west: b.getWest() - mx, south: b.getSouth() - my,
         east: b.getEast() + mx, north: b.getNorth() + my });
}

function fallbackDemProgress(done, total) {
  demProgress = done < total ? T.terrainCopernicusLoading.replace('%1', done).replace('%2', total) : '';
  updateStatus();
}

function setFallbackDem(dem) {
  var bytes = atob(dem.data);
  var buffer = new Uint8Array(bytes.length);
  for (var i = 0; i < bytes.length; i++) buffer[i] = bytes.charCodeAt(i);
  dem.heights = new Float32Array(buffer.buffer);
  delete dem.data;
  fallbackDem = dem;
  demProgress = '';
  if (!viewer) return;
  viewer.terrainProvider = fallbackProvider(dem);
  terrainState = 'copernicus';
  terrainName = T.terrainCopernicus;
  updateStatus();
}

function fallbackDemFailed(reason) {
  fallbackDemRequested = false;
  demProgress = '';
  terrainName = T.terrainNone + ' — ' + reason;
  updateStatus();
}

function setExaggeration(value) {
  exaggeration = +value;
  document.getElementById('exaggerationValue').textContent = exaggeration + '×';
  if (!viewer) return;
  viewer.scene.verticalExaggeration = exaggeration;
  // Absolute heights are not exaggerated by Cesium: flown tracks are scaled
  // here so that they stay above the exaggerated relief
  render3DTracks();
}

// ------------------------------------------------------------ 3D tracks ----

// Keeps at most `max` evenly spread points; the last one is always kept.
function decimate(coords, max) {
  if (coords.length <= max) return coords;
  var out = [], step = (coords.length - 1) / (max - 1);
  for (var i = 0; i < max; i++) out.push(coords[Math.round(i * step)]);
  return out;
}

// Draws every visible track; returns true if there is at least one.
function render3DTracks() {
  if (!viewer) return false;
  entities3d.forEach(function(e) { viewer.entities.remove(e); });
  entities3d = [];
  var curtain = document.getElementById('curtain').checked;
  var any = false;

  Object.keys(tracks).forEach(function(id) {
    var t = tracks[id];
    if (!t.visible) return;
    (t.data.features || []).forEach(function(f) {
      if (!f.geometry || f.geometry.type !== 'LineString') return;
      var coords = f.geometry.coordinates;
      if (!coords || coords.length < 2) return;
      any = true;
      var p = f.properties || {};
      var color = Cesium.Color.fromCssColorString(t.color);
      var description = popupHtml(p);
      var flown = p.prefers_3d && coords[0].length >= 3;

      if (flown) {
        var pts = decimate(coords, 20000);
        var flat = [];
        pts.forEach(function(c) { flat.push(c[0], c[1], c[2] * exaggeration); });
        var positions = Cesium.Cartesian3.fromDegreesArrayHeights(flat);
        entities3d.push(viewer.entities.add({
          name: p.name || id, description: description,
          polyline: {
            positions: positions, width: 3, arcType: Cesium.ArcType.NONE,
            material: color,
            // Still visible, dimmed, where the relief hides it
            depthFailMaterial: color.withAlpha(0.35)
          }
        }));
        if (curtain) {
          var wallPts = decimate(coords, 3000);
          var wallFlat = [], maxHeights = [];
          wallPts.forEach(function(c) { wallFlat.push(c[0], c[1]); maxHeights.push(c[2] * exaggeration); });
          entities3d.push(viewer.entities.add({
            name: p.name || id, description: description,
            wall: {
              positions: Cesium.Cartesian3.fromDegreesArray(wallFlat),
              maximumHeights: maxHeights,
              minimumHeights: maxHeights.map(function() { return -500; }),
              material: color.withAlpha(0.22), outline: false
            }
          }));
        }
        var first = coords[0], last = coords[coords.length - 1];
        [[first, Cesium.Color.LIMEGREEN], [last, Cesium.Color.RED]].forEach(function(m) {
          entities3d.push(viewer.entities.add({
            position: Cesium.Cartesian3.fromDegrees(m[0][0], m[0][1], m[0][2] * exaggeration),
            point: { pixelSize: 9, color: m[1], outlineColor: Cesium.Color.WHITE, outlineWidth: 1,
                     disableDepthTestDistance: Number.POSITIVE_INFINITY }
          }));
        });
      } else {
        var flat2 = [];
        decimate(coords, 20000).forEach(function(c) { flat2.push(c[0], c[1]); });
        entities3d.push(viewer.entities.add({
          name: p.name || id, description: description,
          polyline: {
            positions: Cesium.Cartesian3.fromDegreesArray(flat2),
            width: 3, clampToGround: true, material: color
          }
        }));
      }
    });
  });
  return any;
}

function fit3D() {
  if (!viewer || entities3d.length === 0) return;
  viewer.flyTo(entities3d, {
    duration: 1.5,
    offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-35), 0)
  });
}
</script>
